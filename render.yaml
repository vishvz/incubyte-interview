# Render Blueprint: the API (Node web service) and the frontend (static site).
# Create or sync it in Render: New > Blueprint > pick this repository. Render asks for the values marked sync: false.
#
# The two services point at each other by their public onrender.com URLs. Render's fromService only exposes
# private-network hostnames, so the URLs are written here. If Render gives a service a different URL
# (for example with a suffix because the name is taken), update VITE_API_URL and CORS_ORIGIN below.
services:
  - type: web
    name: acme-salaries-api
    runtime: node
    rootDir: backend
    # Same region as the Neon database (ap-southeast-1), to keep query latency low.
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations are idempotent; running them at start keeps the schema in step on the free plan,
    # which has no pre-deploy command. They use DATABASE_URL_UNPOOLED (direct connection).
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon direct connection string (migrations)
      - key: AUTH_PASSWORD
        sync: false # shared HR password, at least 12 characters
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # The deployed frontend, plus local development.
        value: https://acme-salaries-web.onrender.com,http://localhost:5173

  - type: web
    name: acme-salaries-web
    runtime: static
    # Built from the repo root so the publish path is unambiguous.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    # Single-page app: every path serves index.html, and React Router picks the page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://acme-salaries-api.onrender.com
