# Local PostgreSQL for reviewers: `docker compose up -d`
# Then use the URLs in backend/.env.example (user postgres, password postgres).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432' # local machine only, not the LAN
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
